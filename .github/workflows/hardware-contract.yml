name: Sensor contracts and custom chips
on:
  push:
    branches: [feat/wokwi-all-sensors, main, master]
  pull_request:
    paths: ['firmware/all_sensors/**', 'backend/hardware*', 'tests/hardware/**', 'dashboard/public/hardware*', 'dashboard/public/*acquisition.js', 'dashboard/public/acquisition-dashboard.js', 'dashboard/public/index.html', 'dashboard/public/wokwi-dashboard.js']
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m unittest discover -s tests/hardware -p 'test_*.py' -v
      - run: node --test tests/hardware/*.test.cjs
      - run: node --test tests/wokwi-feed.test.cjs
      - run: python scripts/verify_wokwi_publication.py
      - run: |
          g++ -std=c++11 tests/hardware/par_protocol.cpp -o /tmp/par-protocol
          /tmp/par-protocol
          g++ -std=c++11 tests/hardware/finite_float.cpp -o /tmp/finite-float
          /tmp/finite-float
      - run: node --check dashboard/public/hardware.js
      - run: node --check dashboard/public/acquisition-dashboard.js
      - run: python firmware/all_sensors/tools/summarize_validation.py
      # These browser/backend receipts predate the optical and wiring fixes.
      # Validate them against their archived sources, not the current firmware.
      # Current publication is checked by verify_wokwi_publication.py above.
      - name: Checkout sources of historical collective observations
        uses: actions/checkout@v4
        with:
          ref: 3b3c8771ff181ad057c25feafefd9828878a748e
          path: .historical-wokwi
      - name: Verify historical collective observations (23 projects)
        run: python .historical-wokwi/firmware/all_sensors/tools/summarize_collective_validation.py
      - run: python -m compileall -q backend/hardware_telemetry.py backend/hardware_routes.py backend/main.py
