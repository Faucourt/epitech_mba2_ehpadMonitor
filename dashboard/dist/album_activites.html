<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résidence EpiD'or — Album des Activités</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      background: #f5f0e8;
      color: #2c2416;
      min-height: 100vh;
    }

    /* ── Header ── */
    .album-header {
      background: #fff;
      border-bottom: 2px solid #d4af6a;
      padding: 22px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.45rem;
      font-weight: 700;
      color: #2c2416;
      letter-spacing: .01em;
    }
    .header-title .gold { color: #b8870b; }
    .fleur { font-size: 1.3rem; color: #b8870b; }
    .back-btn {
      font-family: "Segoe UI", sans-serif;
      font-size: .85rem;
      padding: 7px 14px;
      background: #f0e8d5;
      border: 1px solid #d4af6a;
      border-radius: 8px;
      color: #7a5c1e;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }
    .back-btn:hover { background: #e8d9bc; }

    /* ── Filtre résident actif ── */
    .resident-filter-bar {
      display: none;
      background: #fff8e8;
      border-bottom: 1px solid #e8d5a0;
      padding: 10px 32px;
      font-family: "Segoe UI", sans-serif;
      font-size: .88rem;
      color: #7a5c1e;
      align-items: center;
      gap: 10px;
    }
    .resident-filter-bar.active { display: flex; }
    .resident-pill {
      background: #b8870b;
      color: #fff;
      border-radius: 999px;
      padding: 3px 12px;
      font-weight: 700;
      font-size: .85rem;
    }

    /* ── Contenu principal ── */
    .album-body { max-width: 1200px; margin: 0 auto; padding: 36px 24px 60px; }

    .album-intro {
      text-align: center;
      margin-bottom: 36px;
    }
    .album-intro h2 {
      font-size: 1.0rem;
      color: #7a5c1e;
      font-weight: 400;
      font-style: italic;
      letter-spacing: .03em;
    }

    /* ── Grille activités ── */
    .activities-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }
    @media (max-width: 900px) { .activities-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 580px) { .activities-grid { grid-template-columns: 1fr; } }

    .activity-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 28px rgba(44,36,22,.10);
      border: 1px solid #e4d5b8;
      transition: transform .2s, box-shadow .2s;
    }
    .activity-card:hover { transform: translateY(-3px); box-shadow: 0 12px 36px rgba(44,36,22,.16); }
    .activity-card.highlighted { border: 2px solid #b8870b; box-shadow: 0 8px 32px rgba(184,135,11,.22); }

    .card-image {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      display: block;
      background: #ede5d4;
    }
    .card-image-placeholder {
      width: 100%;
      aspect-ratio: 16/10;
      background: linear-gradient(135deg, #f0e8d5, #e4d5b8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b8a080;
      font-size: 2.5rem;
    }

    .card-body { padding: 16px 18px 18px; }
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #2c2416;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: .85rem;
      color: #7a6848;
      font-style: italic;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .card-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4af6a, transparent);
      margin: 10px 0;
    }
    .card-residents-label {
      font-family: "Segoe UI", sans-serif;
      font-size: .75rem;
      font-weight: 700;
      color: #b8870b;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }
    .card-residents {
      font-family: "Segoe UI", sans-serif;
      font-size: .82rem;
      color: #5a4a2e;
      line-height: 1.55;
    }
    .resident-name-highlight {
      font-weight: 700;
      color: #b8870b;
      background: #fff8e0;
      border-radius: 4px;
      padding: 0 3px;
    }

    /* ── Badge participation ── */
    .card-badge {
      display: none;
      font-family: "Segoe UI", sans-serif;
      font-size: .75rem;
      font-weight: 700;
      background: #b8870b;
      color: #fff;
      border-radius: 999px;
      padding: 2px 10px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .highlighted .card-badge { display: inline; }
  </style>
</head>
<body>

<header class="album-header">
  <div class="header-title">
    <span class="fleur">✦</span>
    Résidence <span class="gold">EpiD'or</span>&nbsp;—&nbsp;Album des Activités
    <span class="fleur">✦</span>
  </div>
  <a class="back-btn" href="javascript:history.back()">← Retour</a>
</header>

<div class="resident-filter-bar" id="filter-bar">
  Activités de <span class="resident-pill" id="filter-name"></span>
  <span style="color:#a08050">— Les activités où votre proche participe sont mises en avant</span>
</div>

<main class="album-body">
  <div class="album-intro">
    <h2>La vie sociale et culturelle de notre résidence, semaine après semaine.</h2>
  </div>
  <div class="activities-grid" id="activities-grid"></div>
</main>

<script>
const ACTIVITIES = [
  {
    id: 'theatre',
    nom: 'Théâtre',
    description: 'Atelier théâtre et expression corporelle',
    image: '/activites/01_theatre_scene.png',
    emoji: '🎭',
    residents: ['Marie Curie', 'Louis Pasteur', 'Joséphine Baker', 'Jean Gabin', 'Line Renaud', 'Fernandel']
  },
  {
    id: 'dominos',
    nom: 'Dominos',
    description: 'Jeux de table en petit groupe',
    image: '/activites/02_dominos_scene.png',
    emoji: '🁣',
    residents: ['Fernandel', 'Brigitte Bardot', 'Jean-Paul Belmondo', 'Mireille Mathieu', 'Claude Brasseur']
  },
  {
    id: 'loto',
    nom: 'Loto',
    description: "Loto de l'après-midi en salle commune",
    image: '/activites/03_loto_scene.png',
    emoji: '🎰',
    residents: ['Brigitte Bardot', 'Henri Salvador', 'Line Renaud', 'Bourvil', 'Roger Leblanc', 'Germaine Fontaine']
  },
  {
    id: 'dessin',
    nom: 'Dessin',
    description: 'Atelier dessin et couleurs.',
    image: '/activites/04_dessin_scene.png',
    emoji: '🎨',
    residents: ['Marie Curie', 'Fernandel', 'Brigitte Bardot', 'Mireille Mathieu', 'Jean-Paul Belmondo']
  },
  {
    id: 'jardin',
    nom: 'Jardin',
    description: 'Promenade accompagnée au jardin thérapeutique.',
    image: '/activites/05_jardin_scene.png',
    emoji: '🌿',
    residents: ['Jeanne Moreau', 'Yves Montand', 'Henri Salvador', 'Alain Delon', 'Line Renaud', 'Joséphine Baker']
  },
  {
    id: 'chorale',
    nom: 'Chorale',
    description: 'Chants en chœur pour le plaisir de tous.',
    image: '/activites/06_chorale_scene.png',
    emoji: '🎵',
    residents: ['Jean Gabin', 'Louis Pasteur', 'Brigitte Bardot', 'Joséphine Baker', 'Claude François', 'Sophie Marceau']
  }
];

// Récupère le prénom/nom du résident depuis l'URL (?resident=Marie+Curie)
const params = new URLSearchParams(location.search);
const filterResident = params.get('resident') || '';

if (filterResident) {
  document.getElementById('filter-bar').classList.add('active');
  document.getElementById('filter-name').textContent = filterResident;
}

function normalise(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function residentMatch(name) {
  if (!filterResident) return false;
  return normalise(name).includes(normalise(filterResident)) ||
         normalise(filterResident).includes(normalise(name.split(' ')[0]));
}

function renderGrid() {
  const grid = document.getElementById('activities-grid');
  grid.innerHTML = ACTIVITIES.map(act => {
    const participates = filterResident && act.residents.some(r => residentMatch(r));
    const residentsHtml = act.residents.map(r => {
      const hi = residentMatch(r);
      return hi ? `<span class="resident-name-highlight">${r}</span>` : r;
    }).join(', ');

    // Image avec fallback placeholder
    const imgHtml = `<img class="card-image" src="${act.image}" alt="${act.nom}"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="card-image-placeholder" style="display:none">${act.emoji}</div>`;

    return `
      <div class="activity-card${participates ? ' highlighted' : ''}">
        ${imgHtml}
        <div class="card-body">
          <div class="card-title">
            ${act.nom}
            <span class="card-badge">Participe ✓</span>
          </div>
          <div class="card-desc">${act.description}</div>
          <div class="card-divider"></div>
          <div class="card-residents-label">Participants</div>
          <div class="card-residents">${residentsHtml}…</div>
        </div>
      </div>`;
  }).join('');
}

renderGrid();
</script>
</body>
</html>
